name: Deploy Blog to Cloudflare Workers

on:
  push:
    branches:
      - main # 如果你的主分支名称是 master，请将其修改为 master
  workflow_dispatch: # 支持在 GitHub Actions 页面手动触发部署

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action 默认捆绑旧版 wrangler(3.13.x), 不支持 assets 的 run_worker_first 配置,
          # 会导致首页/admin 等匹配静态文件的请求被直接返回模板原文而不经过 Worker 渲染, 必须显式指定新版
          wranglerVersion: "4.123.0"
